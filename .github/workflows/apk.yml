name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android litsenziyalari
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Android loyihasini yaratish
        run: python3 build_android.py

      - name: APK yig'ish
        run: gradle -p android assembleDebug --no-daemon

      - name: Faylni tayyorlash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk 4eKhSAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 4eKhSAI-apk
          path: 4eKhSAI.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: 4eKhSAI APK
          files: 4eKhSAI.apk
          make_latest: true
